title: "misantropic"
subtitle: "fewer letters, fewer people."
documentTitle: "misantropic"
icon: "fas fa-igloo"
footer: '<p>Created with <i class="fas fa-heart nord-heart"></i> by <a href="https://fatihertem.com" target="_blank" rel="noopener">fatih</a></p>'
connectivityCheck: false
columns: "3"

defaults:
  layout: columns
  colorTheme: dark

theme: default

links:
  - name: "Home"
    icon: "fas fa-house"
    url: "#"
  - name: "About"
    icon: "fas fa-circle-info"
    url: "#about"

colors:
  dark: &nord
    highlight-primary: "#5e81ac"
    highlight-secondary: "#4c6a8f"
    highlight-hover: "#81a1c1"
    background: "#2e3440"
    card-background: "#3b4252"
    text: "#eceff4"
    text-header: "#eceff4"
    text-title: "#eceff4"
    text-subtitle: "#d8dee9"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#88c0d0"
    link-hover: "#ebcb8b"
  light: *nord

services:
  - name: "Tools"
    icon: "fas fa-screwdriver-wrench"
    items:
      - name: "binthere"
        subtitle: "Zero-knowledge pastebin"
        icon: "fas fa-paste"
        url: "https://paste.misantropic.net"
      - name: "Seal"
        subtitle: "Offline file encryption in your browser"
        icon: "fas fa-lock"
        url: "https://seal.misantropic.net"
      - name: "Mail"
        subtitle: "Fast, focused email client"
        icon: "fas fa-envelope"
        url: "https://mail.misantropic.net"

  - name: "Matrix"
    icon: "fab fa-matrix"
    items:
      - name: "Homeserver"
        type: "Matrix"
        endpoint: "https://matrix.misantropic.net"
        subtitle: "Invite-only · Continuwuity"
        icon: "fas fa-server"
        url: "#about"
      - name: "Element"
        subtitle: "The classic Matrix client"
        icon: "fas fa-comments"
        url: "https://chat.misantropic.net"
      - name: "Sable"
        subtitle: "An almost stable Matrix client"
        icon: "fas fa-paw"
        url: "https://sable.misantropic.net"

  - name: "Play"
    icon: "fas fa-gamepad"
    items:
      - name: "UNO"
        subtitle: "Multiplayer with friends or bots"
        icon: "fas fa-clone"
        url: "https://uno.misantropic.net"

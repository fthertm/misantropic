message:
  style: "is-dark"
  title: "Hi, I'm Faith"
  content: >-
    <p><strong>misantropic</strong> <em>/mi.sæn.ˈtrɒp.ɪk/</em> adj. like misanthropic,
    with fewer h's and no regrets.</p>
    <p>This is my small corner of the internet: a handful of privacy-minded, self-hosted tools I build and maintain by hand for myself and close friends. You can also check out my other work on my <a href="https://fatihertem.com" target="_blank" rel="noopener">portfolio</a>.</p>
    <p>The Matrix homeserver runs on <a href="https://continuwuity.org" target="_blank" rel="noopener">Continuwuity</a> under <code>misantropic.net</code>. Registration is invite-only—if you'd like an account, just message <code>@fatih:misantropic.net</code>.</p>
    <p>Matrix is the best way to reach me. Email works too (<code>skynet [at] misantropic.net</code>), but I'd rather you didn't.</p>

message:
  style: "is-dark"
  title: "Hi, I'm Faith"
  content: >-
    <p><strong>misantropic</strong> <em>/mi.sæn.ˈtrɒp.ɪk/</em> adj. like misanthropic,
    with fewer h's and no regrets.</p>
    <p>This is my small corner of the internet: a handful of self-hosted tools I run for myself and for friends.</p>
    <p>Everything here is privacy-minded and built by hand. I host a private Matrix instance on
    <code>misantropic.net</code> using <a href="https://continuwuity.org" target="_blank" rel="noopener">Continuwuity</a>.
    Registration is invite-only—if you'd like an account, just message <code>@fatih:misantropic.net</code>.</p>
    <p>Matrix is the best way to reach me. Email works too
    (<code>skynet [at] misantropic.net</code>), but I'd rather you didn't.</p>


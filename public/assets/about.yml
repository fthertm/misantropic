message:
  style: "is-dark"
  title: "Hi, I'm Fatih"
  content: >-
    <p><strong>misantropic</strong> <em>/ˌmɪs.ənˈtrɒp.ɪk/</em> adj. misanthropic,
    minus an h, minus the company.</p>
    <p>I run a few small things here for myself and a couple of friends: a Matrix
    homeserver, a pastebin, a file drop. Nothing is public, nothing phones home.</p>
    <p>The <a href="https://continuwuity.org" target="_blank" rel="noopener">Continuwuity</a>
    homeserver for <code>misantropic.net</code> is mine. Registration is closed — message
    <code>@fatih:misantropic.net</code> if you want an account anyway.</p>
    <p>Matrix is the best way to reach me. Email works too, skynet [at] misantropic.net,
    but I'd rather you didn't.</p>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const originalFetch = window.fetch;
        const memoryCache = new Map();

        window.fetch = async function(...args) {
          const req = args.at(0);
          const url = typeof req === 'string' ? req : (req && req.url);

          if (url && (url.includes('/_matrix/federation/v1/version') || url.includes('.yml'))) {
            const cacheKey = new URL(url, window.location.origin).pathname;
            const cached = memoryCache.get(cacheKey);
            if (cached && (Date.now() - cached.time < 300000)) {
              return cached.response.clone();
            }
            const response = await originalFetch.apply(this, args);
            if (response.ok) {
              memoryCache.set(cacheKey, { time: Date.now(), response: response.clone() });
            }
            return response;
          }

          return originalFetch.apply(this, args);
        };

        // Sayfa ilk açıldığında about.yml ve config.yml dosyalarını arka planda RAM'e yükle
        window.addEventListener('DOMContentLoaded', () => {
          fetch('assets/about.yml').catch(() => {});
        });

        // Gecikmeye yol açan eski Service Worker kayıtlarını otomatik temizle
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(reg => reg.unregister());
          });
        }
      })();
    </script>
    <link rel="icon" href="assets/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
    <link rel="mask-icon" href="assets/icons/logo.svg">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

    <link rel="stylesheet" href="assets/custom.css">
  </head>

    <div id="app-mount"></div>
  </body>
</html>
